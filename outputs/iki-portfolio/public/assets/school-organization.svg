  <g transform="translate(150 100) rotate(-8 147 178)"><rect width="296" height="357" fill="#f7f7f0"/><text x="25" y="36" fill="#8d9684" font-family="monospace" font-size="8" letter-spacing="2">A SHARED PURPOSE / FIELD NOTES</text><path d="M25 51h246" stroke="#d4d9ca"/><text x="24" y="98" fill="#303c2b" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1">Better,</text><text x="24" y="143" fill="#303c2b" font-family="Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-1">together.</text><text x="26" y="181" fill="#879180" font-family="monospace" font-size="8" letter-spacing="2">LISTEN → PLAN → DO → LEARN</text><g stroke="#d6dbce"><path d="M25 223h246M25 257h246M25 291h246M25 325h246"/></g><g fill="none" stroke="#76836b"><rect x="27" y="203" width="9" height="9"/><rect x="27" y="237" width="9" height="9"/><rect x="27" y="271" width="9" height="9"/></g><g fill="#738167" font-family="Arial,sans-serif" font-size="10"><text x="46" y="211">Make space for different voices.</text><text x="46" y="245">Give every task a clear purpose.</text><text x="46" y="279">Find a way forward, together.</text></g></g>
